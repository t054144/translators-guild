<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Guild Translation Handbook</title>
<link rel="stylesheet" href="fonts.css">
<style>
@page { size: 148mm 210mm; margin: 0; }
:root{
  --ink:#1c1030; --ink-2:#4a3d5e; --ink-3:#7a6d8c;
  --violet:#650fd0; --plum:#8218c7; --magenta:#a726d0;
  --lilac:#d6bfea; --mist:#f6f0fc; --mist-2:#ede3f8; --rule:#e2d4f2;
  --void:#110620;
  --ok:#0e8f63; --ok-bg:#e6f6ef; --no:#d63a5a; --no-bg:#fdecef; --amber:#b86e00; --amber-bg:#fff4e2;
  --grad: linear-gradient(135deg,#a726d0 0%,#8218c7 48%,#650fd0 100%);
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Outfit","Segoe UI",sans-serif;
  --ar:"Amiri","Noto Naskh Arabic",serif;
  --ar-sans:"Readex Pro","Noto Sans Arabic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8d8499}
body{font-family:var(--sans);font-weight:400;font-size:7.8pt;line-height:1.4;color:var(--ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:lining-nums;hyphens:auto}
@media screen{ body{padding:24px 0} .page{margin:0 auto 24px;box-shadow:0 10px 30px rgba(0,0,0,.35)} }

/* ---------- page frame ---------- */
.page{width:148mm;height:210mm;position:relative;overflow:hidden;background:#fff;break-after:page;counter-increment:folio}
body{counter-reset:folio}
.page .body{position:absolute;top:14.5mm;bottom:15mm;left:12mm;right:16mm;overflow:hidden}
.page:nth-of-type(odd) .body{left:16mm;right:12mm}
.rh{position:absolute;top:7.5mm;left:12mm;right:16mm;display:flex;justify-content:space-between;align-items:center;
  font-size:6.3pt;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.page:nth-of-type(odd) .rh{left:16mm;right:12mm;flex-direction:row-reverse}
.rh .ar{letter-spacing:0;text-transform:none;font-family:var(--ar-sans);font-size:6.8pt;font-weight:400}
.folio{position:absolute;bottom:7mm;left:12mm;display:flex;align-items:center;gap:5px;font-size:7pt;font-weight:600;color:var(--violet)}
.page:nth-of-type(odd) .folio{left:auto;right:12mm;flex-direction:row-reverse}
.folio::before{content:counter(folio)}
.folio i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--violet)}
.folio i:nth-child(2){background:#9a6fe0}.folio i:nth-child(3){background:var(--lilac)}
.edge{position:absolute;top:0;bottom:0;width:3.2mm;background:var(--grad);right:0}
.page:nth-of-type(even) .edge{right:auto;left:0}

/* ---------- type ---------- */
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:1.2em;line-height:1.25;font-weight:400}
.ar-s{font-family:var(--ar-sans);direction:rtl;unicode-bidi:isolate}
p{margin:0 0 1.6mm}
h2{font-family:var(--serif);font-weight:700;font-size:13pt;line-height:1.1;color:var(--ink);margin:0 0 2mm}
h3{font-family:var(--serif);font-weight:700;font-size:10pt;line-height:1.2;color:var(--violet);margin:3.2mm 0 1.4mm;display:flex;align-items:baseline;gap:2mm}
h3 .ar{font-family:var(--ar-sans);font-size:7.6pt;color:var(--magenta);font-weight:400;margin-left:auto}
h3:first-child{margin-top:0}
h4{font-size:6.6pt;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--magenta);margin:2.4mm 0 1mm}
em{font-style:italic} b,strong{font-weight:600}
.lead{font-size:8.4pt;line-height:1.45;color:var(--ink-2);font-weight:300}
.small{font-size:7.2pt;color:var(--ink-2)}
.muted{color:var(--ink-3)}
ul,ol{margin:0 0 1.8mm 4.2mm} li{margin:0 0 .7mm;padding-left:.6mm}
ul li::marker{color:var(--magenta)}
ol li::marker{color:var(--violet);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2.6mm}
.src{font-size:6.4pt;color:var(--ink-3);margin-top:1mm}
.src::before{content:"Source · ";font-weight:600;color:var(--magenta)}
.x{color:var(--no);font-weight:600} .ok{color:var(--ok);font-weight:600}
.x::before{content:"✗ "} .ok::before{content:"✓ "}
.dir{display:inline-block;font-size:5.6pt;font-weight:600;letter-spacing:.1em;padding:.4mm 1.5mm;border-radius:9px;background:var(--mist-2);color:var(--violet);vertical-align:middle;white-space:nowrap}
.pill{display:inline-block;font-size:6pt;font-weight:600;letter-spacing:.06em;padding:.3mm 1.6mm;border-radius:9px;background:var(--violet);color:#fff}

/* ---------- chapter opener ---------- */
.opener{position:relative;margin:0 0 3mm;padding:0 0 3mm;border-bottom:.35mm solid var(--rule)}
.opener .kicker{font-size:6.3pt;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta);font-weight:600;display:flex;align-items:center;gap:2mm}
.opener .num{font-family:var(--serif);font-weight:800;font-size:40pt;line-height:.85;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;float:left;margin:1mm 3.5mm 0 0}
.opener h2{font-size:16pt;margin:1.2mm 0 .8mm}
.opener .arT{font-family:var(--ar-sans);font-size:9.5pt;color:var(--ink-2);direction:rtl;text-align:left;unicode-bidi:isolate;font-weight:300}
.opener::after{content:"";display:block;clear:both}
.dots{display:inline-flex;gap:1.1mm;vertical-align:middle}
.dots i{width:1.7mm;height:1.7mm;border-radius:50%;background:var(--violet)}
.dots i:nth-child(2){background:#9a6fe0}.dots i:nth-child(3){background:var(--lilac)}

/* ---------- boxes ---------- */
.def{background:var(--mist);border-radius:2mm;padding:1.9mm 2.6mm 1.4mm 3mm;margin:0 0 2.2mm;position:relative}
.def::before{content:"";position:absolute;left:0;top:2mm;bottom:2mm;width:.9mm;border-radius:1mm;background:var(--grad)}
.def .lab{font-size:5.8pt;letter-spacing:.18em;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:1mm;display:flex;justify-content:space-between}
.def .lab .ar{font-family:var(--ar-sans);letter-spacing:0;font-size:6.6pt;font-weight:500;color:var(--magenta)}
.def dl{display:grid;grid-template-columns:auto 1fr;gap:.6mm 2.4mm}
.def dt .ar{display:inline;margin-left:1mm}
.def dt{font-weight:600;color:var(--ink);max-width:34mm}
.def dt .ar{font-size:.95em;color:var(--magenta)}
.def dd{color:var(--ink-2)}
.tip{border:.3mm solid var(--lilac);border-radius:2mm;padding:2mm 2.6mm 1.4mm 8mm;position:relative;margin:2mm 0 2.4mm;font-size:7.8pt}
.tip::before{content:"";position:absolute;left:2.6mm;top:2.4mm;width:3.2mm;height:3.2mm;border-radius:50%;background:var(--grad)}
.tip b:first-child{color:var(--violet)}
.warn{background:var(--amber-bg);border-radius:2mm;padding:1.8mm 2.6mm 1.2mm;margin:2mm 0;font-size:7.6pt}
.warn b:first-child{color:var(--amber)}
.quote{font-family:var(--serif);font-style:italic;font-size:10pt;line-height:1.35;color:var(--plum);padding:1mm 0 1mm 3.5mm;border-left:.6mm solid var(--lilac);margin:2mm 0}
.dark{background:var(--void);color:#efe6fb;border-radius:2.4mm;padding:3mm;margin:2mm 0}
.dark h4{color:#d6bfea}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:7pt;line-height:1.3;margin:0 0 2.6mm}
th{background:var(--violet);color:#fff;font-weight:600;text-align:left;padding:1.1mm 1.6mm;font-size:6.6pt;letter-spacing:.04em}
th:first-child{border-top-left-radius:1.4mm} th:last-child{border-top-right-radius:1.4mm}
td{padding:1mm 1.6mm;border-bottom:.2mm solid var(--rule);vertical-align:top}
tr:nth-child(even) td{background:#fbf8fe}
td.ar,th.ar{text-align:right}
td .ar{font-size:1.15em}
table.tight td{padding:.45mm 1.3mm;line-height:1.25} table.tight th{padding:.8mm 1.3mm}
.pairs td:first-child{width:44%}
.pairs td.ar{width:auto}
.arrow{color:var(--magenta);font-weight:700}

/* example pairs */
.ex{display:grid;grid-template-columns:1fr auto 1fr;gap:1.6mm;align-items:baseline;padding:.9mm 0;border-bottom:.2mm dashed var(--rule)}
.ex:last-child{border-bottom:0}
.ex .e{font-style:italic}
.ex .a{text-align:right}
.ex .m{color:var(--magenta);font-size:7pt}
.exs{margin:0 0 2.4mm}
.note{font-size:6.8pt;color:var(--ink-3);grid-column:1/-1;margin-top:-.4mm}

/* numbered steps */
.steps{counter-reset:s;list-style:none;margin-left:0}
.steps li{counter-increment:s;position:relative;padding-left:6.4mm;margin-bottom:1.3mm}
.steps li::before{content:counter(s);position:absolute;left:0;top:-.1mm;width:4.4mm;height:4.4mm;border-radius:50%;background:var(--grad);color:#fff;font-size:6.2pt;font-weight:600;display:flex;align-items:center;justify-content:center}

/* checklists */
.check{list-style:none;margin-left:0}
.check li{position:relative;padding-left:5mm;margin-bottom:.9mm}
.check li::before{content:"";position:absolute;left:0;top:.5mm;width:2.7mm;height:2.7mm;border:.3mm solid var(--violet);border-radius:.7mm}
.check.qs li::before{border-radius:50%}

svg{display:block}
.fig{margin:1.6mm 0 2.6mm}
.cap{font-size:6.4pt;color:var(--ink-3);margin-top:.8mm;text-align:center}
.center{text-align:center}
.tag{font-size:5.8pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta)}
</style>
</head>
<body>
